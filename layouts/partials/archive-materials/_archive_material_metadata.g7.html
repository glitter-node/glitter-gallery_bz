<partial>
  <section class="gallery-section gallery-section-tight">
    <span class="gallery-kicker">$t:gallery.archive_materials.metadata_kicker</span>
    <div class="gallery-feature-details gallery-metadata-grid">
      <p data-each="meta in gallery_archive_material_detail.metadata">{{$t(meta.label_key)}}: {{meta.value ?? $t(meta.value_key)}}</p>
    </div>
    <div class="gallery-record-meta-list">
      <span data-each="tag in gallery_archive_material_detail.tags" class="gallery-chip">{{$t("gallery.tags." + tag)}}</span>
    </div>
  </section>
</partial>
