<partial>
  <section class="gallery-section gallery-section-muted">
    <span class="gallery-kicker">$t:gallery.items.related_records</span>
    <div class="gallery-list">
      <a data-each="record in gallery_item_detail.related_record_items" href='{{record.href ?? "/records"}}' class="gallery-record gallery-record-link">
        <span class="gallery-meta">{{record.type}}</span>
        <h3 class="gallery-record-title">{{$t(record.title_key)}}</h3>
        <p class="gallery-record-body">{{$t(record.body_key)}}</p>
      </a>
    </div>
  </section>
</partial>
