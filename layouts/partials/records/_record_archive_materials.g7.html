<partial>
  <section class="gallery-section">
    <span class="gallery-kicker">$t:gallery.records.archive_materials</span>
    <div class="gallery-grid gallery-grid-2">
      <a data-each="material in gallery_record_detail.related_archive_materials" href='{{material.href ?? "/archive"}}' class="gallery-card gallery-record-link">
        <span class="gallery-meta">{{material.type}} / {{material.identifier ?? ""}}</span>
        <h3 class="gallery-card-title">{{$t(material.title_key)}}</h3>
        <p class="gallery-card-body">{{$t(material.summary_key)}}</p>
      </a>
    </div>
  </section>
</partial>
