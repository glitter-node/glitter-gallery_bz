<partial>
  <section class="gallery-page-head gallery-archive-category-hero">
    <span class="gallery-kicker">$t:gallery.archive.category_kicker</span>
    <h1 class="gallery-page-title">{{$t(gallery_archive_category_detail.title_key)}}</h1>
    <p class="gallery-page-lead">{{$t(gallery_archive_category_detail.body_key)}}</p>
    <div class="gallery-feature-details gallery-metadata-grid">
      <p data-each="meta in gallery_archive_category_detail.metadata">{{$t(meta.label_key)}}: {{meta.value ?? $t(meta.value_key)}}</p>
    </div>
  </section>
</partial>
